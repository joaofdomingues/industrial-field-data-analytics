services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: industrial_load_db
      POSTGRES_USER: industrial_user
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: .env.example
    environment:
      DB_ENGINE: postgres
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - .:/app
    command: sh -c "python manage.py migrate && python manage.py import_machine_data --reset && python manage.py runserver 0.0.0.0:8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://127.0.0.1:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
