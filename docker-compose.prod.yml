services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: industrial_load_db
      POSTGRES_USER: industrial_user
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: change-me-in-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_ENGINE: postgres
      POSTGRES_DB: industrial_load_db
      POSTGRES_USER: industrial_user
      POSTGRES_PASSWORD: password123
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CORS_ALLOWED_ORIGINS: http://localhost
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
